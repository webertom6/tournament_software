<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Software</title>
    <link rel="icon" type="image/svg+xml" href="./assets/logo_charneux.svg">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/page-tournament.css">
    <link rel="stylesheet" href="./css/print.css">
</head>
<body>
    <header class="app-header">
        <div class="app-header-inner">
            <div class="app-brand">
                <div class="app-logo-square" aria-hidden="true"></div>
                <div>
                    <p class="app-brand-title text-label">Tournament Software</p>
                    <p class="app-brand-subtitle">Team registration, Group matches, and Knockout finals</p>
                </div>
            </div>
            <nav class="app-nav">
                <span class="app-nav-active">Operator</span>
                <a class="app-nav-link" href="./summary.html">Open Summary</a>
            </nav>
        </div>
    </header>

    <main class="app-main" id="app-root">
        <div class="progress-bar" id="progress-bar"></div>

        <div class="operator-toolbar">
            <button id="btn-toggle-summary-standings" type="button" class="secondary toggle-on">Standings: ON</button>
            <button id="btn-toggle-summary-scroll" type="button" class="secondary toggle-off">Auto-scroll: OFF</button>
            <button id="btn-export-state" type="button">Export state</button>
            <button id="btn-import-state" type="button">Import state</button>
            <button id="btn-export-print" type="button" class="secondary">Export / Print</button>
            <button id="btn-reset-state" type="button" class="danger">Reset all</button>
            <button id="btn-expand-all" type="button" class="secondary">Expand all</button>
            <button id="btn-collapse-all" type="button" class="secondary">Collapse all</button>
        </div>

        <div class="panel export-print-panel" id="export-print-panel" hidden>
            <div class="grid-4">
                <label>
                    Content
                    <select id="export-print-content">
                        <option value="phase">Current phase</option>
                        <option value="standings">Standings table</option>
                    </select>
                </label>
                <label>
                    Paper size
                    <select id="export-print-paper">
                        <option value="A0">A0</option>
                        <option value="A1">A1</option>
                        <option value="A2">A2</option>
                        <option value="A3">A3</option>
                        <option value="A4" selected>A4</option>
                        <option value="A5">A5</option>
                    </select>
                </label>
                <button id="btn-export-print-generate" type="button">Print</button>
            </div>
        </div>

        <div class="card overview-card">
            <h2>Overview</h2>
            <div id="config-overview"></div>
            <div id="qualified-count-message" class="muted" role="status" hidden></div>
            <div class="button-row">
                <button id="btn-generate-phase1" type="button">Generate phase 1 schedule</button>
                <button id="btn-start-knockout" type="button">Generate phase 2 knockout</button>
                <button id="btn-back-to-phase1" type="button">Back to phase 1</button>
                <button id="btn-reset-phases" type="button">Reset phases</button>
            </div>
        </div>

        <details class="card" id="section-setup" data-section="setup">
            <summary class="card-summary">
                <h2 id="setup-title">Setup</h2>
                <span class="chevron" aria-hidden="true"></span>
            </summary>
            <div class="card-body">
            <div class="grid-2">
                <div class="panel">
                    <h3>Teams</h3>
                    <form id="form-add-team">
                        <label for="team-name">Team name</label>
                        <div class="inline-form">
                            <input id="team-name" name="team-name" type="text" maxlength="60" placeholder="Example: Red Tigers" autocomplete="organization" required>
                            <button type="submit">Add team</button>
                        </div>
                    </form>
                    <div id="teams-list"></div>
                </div>

                <div class="panel">
                    <h3>Terrains</h3>
                    <form id="form-add-terrain">
                        <label for="terrain-name">Terrain name</label>
                        <div class="inline-form">
                            <input id="terrain-name" name="terrain-name" type="text" maxlength="60" placeholder="Example: A (prefix &quot;Terrain&quot; will be added automatically)" autocomplete="off" required>
                            <button type="submit">Add terrain</button>
                        </div>
                    </form>
                    <div id="terrains-list"></div>
                </div>
            </div>

            <div class="panel">
                <h3>Rules and qualification</h3>
                <form id="form-config" class="grid-4">
                    <label>
                        POINT_VICTORY_PHASE1
                        <input id="cfg-win" type="number" step="1" min="0" placeholder="e.g. 3" required>
                    </label>
                    <label>
                        POINT_DRAW_PHASE1
                        <input id="cfg-draw" type="number" step="1" min="0" placeholder="e.g. 1" required>
                    </label>
                    <label>
                        POINT_LOSS_PHASE1
                        <input id="cfg-loss" type="number" step="1" min="0" placeholder="e.g. 0" required>
                    </label>
                    <label>
                        Phase 1 matches per team
                        <input id="cfg-phase1-matches" type="number" step="1" min="1" placeholder="e.g. 5" required>
                    </label>
                    <label>
                        Qualified teams for knockout
                        <select id="cfg-qualified" required></select>
                    </label>
                    <label>
                        Seeding policy
                        <select id="cfg-seeding">
                            <option value="ranking">Ranking order</option>
                            <option value="random">Randomized</option>
                        </select>
                    </label>
                    <label class="checkbox-line">
                        <input id="cfg-third-place" type="checkbox">
                        Enable third place match
                    </label>
                    <label>
                        Match duration (minutes)
                        <input id="cfg-match-duration" type="number" step="1" min="1" placeholder="e.g. 10" required>
                    </label>
                    <label>
                        Pause / break duration (minutes)
                        <input id="cfg-pause-duration" type="number" step="1" min="1" placeholder="e.g. 3" required>
                    </label>
                    <div class="button-row">
                        <button type="submit">Save config</button>
                    </div>
                </form>
            </div>
            </div>
        </details>

        <details class="card" id="section-phase1" data-section="phase1">
            <summary class="card-summary">
                <h2 id="phase1-title">Phase 1 matches</h2>
                <span class="chevron" aria-hidden="true"></span>
            </summary>
            <div class="card-body">
            <div id="phase1-summary"></div>
            <div id="phase1-matches"></div>
            </div>
        </details>

        <details class="card" id="section-standings" data-section="standings">
            <summary class="card-summary">
                <h2 id="standings-title">Standings</h2>
                <span class="chevron" aria-hidden="true"></span>
            </summary>
            <div class="card-body">
            <div id="phase1-standings"></div>
            </div>
        </details>

        <details class="card" id="section-knockout" data-section="knockout">
            <summary class="card-summary">
                <h2 id="knockout-title">Phase 2 knockout</h2>
                <span class="chevron" aria-hidden="true"></span>
            </summary>
            <div class="card-body">
            <div id="knockout-summary"></div>
            <div id="knockout-rounds"></div>
            <div id="third-place-block"></div>
            <div id="champion-block"></div>
            </div>
        </details>

        <details class="card" id="section-audit" data-section="audit">
            <summary class="card-summary">
                <h2>Audit and correction history</h2>
                <span class="chevron" aria-hidden="true"></span>
            </summary>
            <div class="card-body">
            <div id="audit-log"></div>
            </div>
        </details>
    </main>

    <div id="print-root" aria-hidden="true"></div>

    <input id="import-state-input" type="file" accept="application/json" hidden>

    <script src="./js/state.js"></script>
    <script src="./js/timer.js"></script>
    <script src="./js/rules.js"></script>
    <script src="./js/scheduler.js"></script>
    <script src="./js/bracket.js"></script>
    <script src="./js/actions.js"></script>
    <script src="./js/render.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
